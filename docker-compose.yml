services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: blacksite-incident-17:latest
    container_name: blacksite-incident-17
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - FLAG=${FLAG:-BREACH{test_flag_for_docker}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
